name: 线报屋监控

# 每 5 分钟跑一次（GitHub Actions 免费版最小间隔就是 5 分钟）
# 注意：GitHub 的 cron 是 UTC，且高峰期可能延迟几分钟，属正常现象。
on:
  schedule:
    - cron: '*/5 * * * *'
  # 允许在网页上手动点「Run workflow」触发，方便调试
  workflow_dispatch:

# 需要写权限才能把 state.json 提交回仓库
permissions:
  contents: write

# 同一时刻只允许一个实例，避免两个 run 同时写状态导致去重失效
concurrency:
  group: hxm5-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 单轮最多 10 分钟，正常只要几秒
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 上一轮提交回来的去重状态。首次运行时文件不存在，脚本会自动初始化基线。
      - name: 恢复去重状态
        run: |
          mkdir -p state
          if [ -f state/hxm5_state.json ]; then
            echo "已有状态：$(python3 -c "import json;print(len(json.load(open('state/hxm5_state.json'))['seen']))") 条记录"
          else
            echo "首次运行，将初始化基线"
          fi

      # 配置全部走 Secrets（不用 Variables，避免多要一类权限）
      # 未配置的项在脚本内有默认值兜底：CID=3 / 回复15条 / 不推图
      - name: 执行监控
        env:
          HXM5_STATE_PATH: state/hxm5_state.json
          # 企微已于 2026-09-24 按老大要求关闭（GitHub 版只推钉钉）
          # 恢复办法：取消下一行注释，并确认 Secret HXM5_WECOM_WEBHOOK 存在
          # HXM5_WECOM_WEBHOOK: ${{ secrets.HXM5_WECOM_WEBHOOK }}
          HXM5_DINGTALK_WEBHOOK: ${{ secrets.HXM5_DINGTALK_WEBHOOK }}
          HXM5_DINGTALK_SECRET: ${{ secrets.HXM5_DINGTALK_SECRET }}
          HXM5_CID: ${{ secrets.HXM5_CID }}
          HXM5_BARK_KEY: ${{ secrets.HXM5_BARK_KEY }}
          HXM5_BARK_LEVEL: ${{ secrets.HXM5_BARK_LEVEL }}
          HXM5_MAX_IMAGES: ${{ secrets.HXM5_MAX_IMAGES }}
          HXM5_REPLY_LIMIT: ${{ secrets.HXM5_REPLY_LIMIT }}
          HXM5_PUSH_IMAGES: ${{ secrets.HXM5_PUSH_IMAGES }}
          HXM5_MAX_POSTS_PER_CYCLE: ${{ secrets.HXM5_MAX_POSTS_PER_CYCLE }}
        run: python3 actions_monitor.py --once

      # 把状态提交回仓库 —— 这是去重能跨轮生效的唯一方式
      # 注意：git add 是原子的，若路径中有不存在的，整条命令会失败，
      #       所以这里只加 state（archive 已在 .gitignore 里，不进仓库）。
      - name: 保存去重状态
        run: |
          git config user.name  "hxm5-bot"
          git config user.email "hxm5-bot@users.noreply.github.com"
          if [ ! -f state/hxm5_state.json ]; then
            echo "没有状态文件，跳过"
            exit 0
          fi
          git add -f state/hxm5_state.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新去重状态 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 并发场景：两个 run 撞在一起时，远端可能已被另一个更新，
          # 直接 push 会被拒（non-fast-forward）导致整个 run 标红。
          # 这里 rebase 后重试；仍失败也只给 warning，不让 run 失败（下轮会补上状态）。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main >/dev/null 2>&1 \
               && git push >/dev/null 2>&1; then
              echo "状态已提交（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，3 秒后重试..."
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          echo "::warning::状态推送失败，本轮状态未保存（下一轮会自动补上）"

name: 线报屋监控

# 触发策略（2026-09-28 改版）
# ---------------------------------------------------------------------
# 背景：GitHub 的 schedule（cron）自 2026-08-26 起平台级不稳定。
#   实测 09-21~09-28 共 60 次运行：配置写的是每 5 分钟，实际触发间隔
#   最短 105 分钟 / 中位 205 分钟 / 最长 413 分钟 —— 中位慢 41 倍，
#   一天只跑约 6 次。线报是瞬时信息，这个频率基本抓不到。
#
# 对策：cron 只负责「定期唤醒」，真正的覆盖率靠 job 内部长循环。
#   一次触发 → job 内部连续轮询约 340 分钟 → 到点自动结束
#   → 下一次 cron 触发的 run 无缝接上（concurrency 串行化的副产品）
#   覆盖面：每天约 6 次 → 每天约 1300 次
#
# 成本：本仓库是 public，GitHub 托管 runner 对公开仓库完全免费、不限时长。
#   ⚠️ 若将来改成 private，Free 计划每月只有 2000 分钟，长循环会瞬间用穿。
on:
  schedule:
    - cron: '*/5 * * * *'
  # 允许在网页上手动点「Run workflow」触发，方便调试
  workflow_dispatch:

# 需要写权限才能把 state.json 提交回仓库
permissions:
  contents: write

# 同一时刻只允许一个实例，避免两个 run 同时写状态导致去重失效。
# 长循环会占住这个 group，期间的 cron 触发会排队，只保留最新的一个 pending，
# 前一个结束后立刻接上 —— 这正是我们要的「无缝衔接」。
concurrency:
  group: hxm5-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # GitHub 单个 job 硬上限 6 小时（360 分钟），这里留 15 分钟余量给收尾
    timeout-minutes: 355

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 长循环主体：一次触发连续轮询，直到接近 job 时限
      - name: 执行监控（长循环）
        env:
          HXM5_STATE_PATH: state/hxm5_state.json
          # 企微已于 2026-09-24 按老大要求关闭（GitHub 版只推钉钉）
          # 恢复办法：取消下一行注释，并确认 Secret HXM5_WECOM_WEBHOOK 存在
          # HXM5_WECOM_WEBHOOK: ${{ secrets.HXM5_WECOM_WEBHOOK }}
          HXM5_DINGTALK_WEBHOOK: ${{ secrets.HXM5_DINGTALK_WEBHOOK }}
          HXM5_DINGTALK_SECRET: ${{ secrets.HXM5_DINGTALK_SECRET }}
          HXM5_CID: ${{ secrets.HXM5_CID }}
          HXM5_BARK_KEY: ${{ secrets.HXM5_BARK_KEY }}
          HXM5_BARK_LEVEL: ${{ secrets.HXM5_BARK_LEVEL }}
          HXM5_MAX_IMAGES: ${{ secrets.HXM5_MAX_IMAGES }}
          HXM5_REPLY_LIMIT: ${{ secrets.HXM5_REPLY_LIMIT }}
          HXM5_PUSH_IMAGES: ${{ secrets.HXM5_PUSH_IMAGES }}
          HXM5_MAX_POSTS_PER_CYCLE: ${{ secrets.HXM5_MAX_POSTS_PER_CYCLE }}
          # ---- 长循环参数（想调节奏只改这三行）----
          HXM5_LOOP_MINUTES: '340'
          HXM5_SLEEP_SECONDS: '60'
          HXM5_MAX_FAILS: '5'
        run: |
          set -u
          mkdir -p state

          if [ -f "$HXM5_STATE_PATH" ]; then
            echo "已有去重状态：$(python3 -c "import json;print(len(json.load(open('$HXM5_STATE_PATH'))['seen']))") 条记录"
          else
            echo "首次运行，脚本将初始化基线"
          fi

          git config user.name  "hxm5-bot"
          git config user.email "hxm5-bot@users.noreply.github.com"

          DEADLINE=$(( $(date +%s) + HXM5_LOOP_MINUTES * 60 ))
          ROUND=0
          FAILS=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ROUND=$((ROUND + 1))
            STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            echo "::group::第 $ROUND 轮 · $STAMP"

            if python3 actions_monitor.py --once; then
              FAILS=0
            else
              FAILS=$((FAILS + 1))
              echo "::warning::第 $ROUND 轮脚本退出码非 0（连续失败 $FAILS 次）"
            fi

            if [ "$FAILS" -ge "$HXM5_MAX_FAILS" ]; then
              echo "::error::连续 $FAILS 轮失败，提前结束长循环"
              echo "::endgroup::"
              break
            fi

            # 去重状态必须每轮回写仓库。
            # 脚本在「无新帖」时完全不写 state，所以这里绝大多数轮次会走到
            # 「状态无变化」分支，不会产生 commit 洪水。
            if [ -f "$HXM5_STATE_PATH" ]; then
              git add -f "$HXM5_STATE_PATH"
              if git diff --cached --quiet; then
                echo "状态无变化"
              else
                git commit -m "chore: 更新去重状态 $STAMP [轮 $ROUND]" >/dev/null
                PUSHED=0
                for i in 1 2 3; do
                  if git pull --rebase --autostash origin main >/dev/null 2>&1 \
                     && git push >/dev/null 2>&1; then
                    echo "状态已提交（第 $i 次尝试）"
                    PUSHED=1
                    break
                  fi
                  echo "第 $i 次推送失败，3 秒后重试"
                  git rebase --abort >/dev/null 2>&1 || true
                  sleep 3
                done
                [ "$PUSHED" -eq 1 ] || echo "::warning::状态推送失败，本轮状态未保存（下一轮会自动补上）"
              fi
            fi

            echo "::endgroup::"
            sleep "$HXM5_SLEEP_SECONDS"
          done

          echo "长循环结束，本轮共执行 $ROUND 轮"
